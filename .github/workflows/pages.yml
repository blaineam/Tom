name: Deploy the tom.wemiller.com redirect to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      # The app itself is served from wemiller.com/tools/tom/app/ (mirrored from web/ + lib/
      # by the portfolio repo). tom.wemiller.com publishes only redirect/: a page that
      # forwards every old path, query and share-link hash there, and a service worker that
      # retires the old offline copy.
      - name: Assemble the redirect site
        run: |
          mkdir _site
          cp -R redirect/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
